// EQEmu headless client protocol.
//
// Transport: TCP to world (eqemu_config.json server.world.headless), one connection per
// headless character. Every message is framed as
//     [uint32 big-endian length][serialized message]
// The client sends ClientFrame messages; the server sends ServerFrame messages.
//
// Handshake: the client's first frame must be a Hello. The server answers with a Welcome or
// a Refused, and closes the connection after a Refused.

syntax = "proto3";

package eqheadless;

// Bumped on incompatible changes. The server refuses other versions.
enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  PROTOCOL_VERSION_CURRENT     = 1;
}

message Hello {
  string token            = 1; // issued by the operator: `world headless:token-create`
  string character        = 2; // character to control; must belong to the token's account
  string sdk_version      = 3; // free text, logged
  uint32 protocol_version = 4; // PROTOCOL_VERSION_CURRENT
}

message Welcome {
  string session_id       = 1;
  uint32 spawn_id         = 2;
  uint32 protocol_version = 3;
}

enum RefusedReason {
  REFUSED_UNSPECIFIED       = 0;
  REFUSED_DISABLED          = 1;  // HeadlessClients:AllowHeadlessClients is false
  REFUSED_BAD_REQUEST       = 2;  // malformed or oversized frame, or first frame wasn't Hello
  REFUSED_PROTOCOL_VERSION  = 3;
  REFUSED_BAD_TOKEN         = 4;  // unknown or revoked token
  REFUSED_UNKNOWN_CHARACTER = 5;  // no such character on the token's account
  REFUSED_LIMIT             = 6;  // MaxTotal / MaxPerAccount reached
  REFUSED_ALREADY_ONLINE    = 7;
  REFUSED_ZONE_BLOCKED      = 8;
  REFUSED_TIMEOUT           = 9;  // no Hello within the handshake timeout
  REFUSED_NOT_IMPLEMENTED   = 10; // e.g. a feature this server doesn't support yet
  REFUSED_ZONE_UNAVAILABLE  = 11; // the character's zone couldn't be started
  REFUSED_SPAWN_FAILED      = 12; // the zone couldn't load the character
}

message Refused {
  RefusedReason reason = 1;
  string        detail = 2; // human-readable
}

// ---- commands (M2.2) ----
//
// Commands are carried out the way a real client would ask for them: the server builds the
// packet a client would send and its normal handler runs, with all its checks. A CommandResult
// with ok=true means "accepted"; the outcome shows up in state (e.g. Self.target_id) and events
// (e.g. "You cannot see your target.").

// EQ chat channel numbers
enum ChatChannel {
  CHAT_GUILD     = 0;
  CHAT_GROUP     = 2;
  CHAT_SHOUT     = 3;
  CHAT_AUCTION   = 4;
  CHAT_OOC       = 5;
  CHAT_BROADCAST = 6;
  CHAT_TELL      = 7;
  CHAT_SAY       = 8;
  CHAT_GMSAY     = 11;
  CHAT_TELL_ECHO = 14;
  CHAT_RAID      = 15;
}

message TargetCommand { uint32 spawn_id = 1; }         // 0 clears the target
message AttackCommand { bool on = 1; }                 // auto-attack
message ChatCommand {
  ChatChannel channel = 1;
  string      text    = 2;  // in say, "#..." are GM commands and "^..." bot commands, as for players
  string      to      = 3;  // tell recipient
}
message SitCommand    { bool sit = 1; }                // false stands up

// Walk to a point along the zone's navmesh at the character's legal run speed, sending the
// same position updates a real client sends. Progress shows in Self; a MoveEvent reports the end.
// plan_only: don't walk, just answer with a MoveEvent (plan_only set): ARRIVED and the route's
// length if there's a way there, NO_PATH if not. A walk under way carries on.
message MoveToCommand { float x = 1; float y = 2; float z = 3; bool plan_only = 4; }
message StopCommand   {}
// group invite, as /invite: a player, or an EQEmu bot you own (HeadlessClients:AllowBots /
// AllowGroupWithPlayers). Empty name invites the current target.
message InviteCommand { string name = 1; }
message FaceCommand   { uint32 spawn_id = 1; }         // turn to face a spawn (0: the target), as /face
message DisbandCommand {}
// cast the spell memorised in a gem (0-based) on your current target, or yourself with none. The
// module enforces what the client does: not while casting, and each gem's refresh time.
message CastCommand     { uint32 gem = 1; uint32 spell_id = 2; } // spell_id 0: whatever is in the gem
message StopCastCommand {}                                          // interrupt your cast
// memorise a spell from your book into a gem; as in the client you sit, and it takes a few seconds.
// spell_id 0 forgets the gem.
message MemorizeCommand { uint32 gem = 1; uint32 spell_id = 2; }
message ConsiderCommand { uint32 spawn_id = 1; }                    // the answer is a ConsiderEvent
message LootCommand     { uint32 corpse_id = 1; }                   // loot everything; answer: LootEvent
// walk to this zone's zone line for `zone` (a short name from ZoneInfo.exits) and through it, as a
// player does; a ZoneEvent follows. Plain MoveTo stops at zone lines instead.
// walk through a zone line to a neighbouring zone: the one with the shortest walk from here, or the
// zone point `number` (zone_points.number: a zone with several entrances to another)
message ZoneToCommand   { string zone = 1; uint32 number = 2; }
// merchants, as the client's merchant window: open (stand within ~20 units), buy and sell, close.
// Opening sends a MerchantEvent with what it sells.
message MerchantCommand { uint32 npc_id = 1; bool open = 2; }
message BuyCommand      { uint32 npc_id = 1; uint32 merchant_slot = 2; uint32 quantity = 3; }
message SellCommand     { uint32 npc_id = 1; int32 slot = 2; uint32 quantity = 3; } // slot: inventory slot
// pick an item up and put it down elsewhere (equip it, put a bag in a slot, bank it); swaps with
// what's there. Bank slots (2000+) need a banker within reach, as in the client.
message MoveItemCommand { int32 from_slot = 1; int32 to_slot = 2; uint32 quantity = 3; }
// scribe the spell scroll on the cursor into the spellbook (book_slot: a free page), as the client
message ScribeCommand   { uint32 book_slot = 1; uint32 spell_id = 2; }                              // leave the group, as /disband
// a combat ability, as the client's ability buttons send it. skill_id is EQ's skill number: on the
// target, kick (30), bash (10), backstab (8), the monk strikes (flying kick 26, round kick 38, tiger
// claw 52, eagle strike 23, dragon punch / tail rake 21), frenzy (74), intimidation (71), taunt (73);
// on yourself, sneak (42), hide (29), feign death (25). The server applies its own checks and timers.
message AbilityCommand  { uint32 skill_id = 1; }
// your pet, as /pet and the pet window. command is EQEmu's pet command number (common/emu_constants.h
// PetCommand): 2 attack (your target), 3 queue attack, 4 follow, 5 guard here, 6 sit (toggle), 12 taunt
// (toggle), 13/14 taunt on/off, 15 hold, 21 spell hold, 27 feign, 28 back off, 29 get lost, 31 regroup.
message PetCommand      { uint32 command = 1; }
// a discipline you know (Self.disciplines), as the combat abilities window: on your target (or you)
message DisciplineCommand { uint32 spell_id = 1; }
// right-click the item in a slot: its click effect, a potion or food, or a tome (learns its discipline)
message UseItemCommand  { int32 slot = 1; }
// parcels, as the parcel tab of a parcel merchant's window (stand within ~20 units; opening the
// window lists what's waiting for you, MerchantEvent.parcels). Send the item in a slot (not an attuned
// one, nor a no-drop one unless the server lets no-drop be traded: World:FVNoDropFlag) to a character
// by name; the server allows
// one parcel per Parcel:ParcelDeliveryDelay. Retrieve one of yours into your bags.
message ParcelSendCommand     { uint32 npc_id = 1; int32 slot = 2; uint32 quantity = 3; string to = 4; string note = 5; }
message ParcelRetrieveCommand { uint32 npc_id = 1; uint32 parcel_slot = 2; uint32 item_id = 3; }
// under water: swim straight up to the surface, for air (a MoveEvent when there)
message SurfaceCommand  { }
message AaExpCommand    { uint32 percent = 1; } // the share of experience to AA (the client's slider): 100 levels no more

message Command {
  uint32 id = 1; // echoed in CommandResult
  oneof action {
    TargetCommand target  = 2;
    AttackCommand attack  = 3;
    ChatCommand   chat    = 4;
    SitCommand    sit     = 5;
    MoveToCommand move_to = 6;
    StopCommand   stop    = 7;
    InviteCommand invite  = 8;
    DisbandCommand disband = 9;
    FaceCommand   face    = 10;
    CastCommand     cast      = 11;
    StopCastCommand stop_cast = 12;
    MemorizeCommand memorize  = 13;
    ConsiderCommand consider  = 14;
    LootCommand     loot      = 15;
    ZoneToCommand   zone_to   = 16;
    MerchantCommand merchant  = 17;
    BuyCommand      buy       = 18;
    SellCommand     sell      = 19;
    MoveItemCommand move_item = 20;
    ScribeCommand   scribe    = 21;
    AbilityCommand  ability   = 22;
    PetCommand      pet       = 23;
    DisciplineCommand discipline = 24;
    UseItemCommand  use_item  = 25;
    ParcelSendCommand     parcel_send     = 26;
    ParcelRetrieveCommand parcel_retrieve = 27;
    SurfaceCommand        surface         = 28;
    AaExpCommand          aa_exp          = 29;
  }
}

message CommandResult {
  uint32 id    = 1;
  bool   ok    = 2;
  string error = 3;
}

// ---- events (M2.2) ----

message ChatMessage {
  ChatChannel channel  = 1;
  string      from     = 2;
  string      to       = 3; // set for tells
  string      text     = 4;
  uint32      language = 5;
}

// A line of game text. The server sends either plain text (text set) or a client string id
// with arguments (string_id set), which the client looks up in eqstr_us.txt.
message ServerMessage {
  uint32          type       = 1; // chat colour / message type
  string          text       = 2;
  uint32          speak_mode = 3; // 0 raw, 1 say, 2 shout, 3 emote-alt, 4 emote, 5 group
  string          sayer      = 4;
  uint32          string_id  = 5;
  repeated string args       = 6;
}

enum MoveStatus {
  MOVE_ARRIVED   = 0;
  MOVE_STOPPED   = 1; // StopCommand, a new MoveTo, or the character sat down
  MOVE_STUCK     = 2; // no progress (rooted, blocked)
  MOVE_NO_PATH   = 3; // no route to the destination
  MOVE_ZONE_LINE = 4; // the route reaches a zone line or teleport; stopped there (zoning is M5)
  MOVE_LOCKED    = 5; // a locked door on the way that this character has no key for
}

message MoveEvent {
  MoveStatus status = 1;
  float      x      = 2; // where the character ended up
  float      y      = 3;
  float      z      = 4;
  bool       plan_only    = 5; // the answer to a plan_only MoveTo: x, y, z are where we asked about
  float      route_length = 6; // plan_only and ARRIVED: how far the walk would be
  repeated NavNote nav    = 7; // where this walk found the navmesh wanting (for fixing the zone's navmesh)
}

// a walk that failed because of the navmesh, or went round a gap in it
message NavNote {
  // no_mesh_here (no navmesh where we stood), no_mesh_there (none at the destination),
  // not_connected (both on the navmesh, no way between: closest is where it gets nearest),
  // stuck (walked into something the navmesh says isn't there), off_mesh (stepped from a hole onto
  // it, to), straight_walk (walked straight to a zone
  // line the navmesh doesn't reach); doors, not the navmesh's: locked (this character can't open it;
  // to: the door), door_wont_open (clicked, and it didn't: a quest's, a trigger's)
  string kind      = 1;
  float  x         = 2; // where it happened
  float  y         = 3;
  float  z         = 4;
  float  to_x      = 5; // where we were going (off_mesh: where we stepped to)
  float  to_y      = 6;
  float  to_z      = 7;
  float  closest_x = 8;
  float  closest_y = 9;
  float  closest_z = 10;
}

enum ZoneStatus {
  ZONE_LEAVING = 0; // the server let us go; a new Welcome and Snapshot follow once we're in `zone`
  ZONE_REFUSED = 1; // the zone change didn't happen; detail says why
}

// zoning (e.g. GM #zone, a zone line, a port): the session survives it
message ZoneEvent {
  ZoneStatus status  = 1;
  uint32     zone_id = 2;
  string     zone    = 3; // short name
  string     detail  = 4;
}

message ConsiderEvent {
  uint32 spawn_id = 1;
  uint32 color    = 2; // con colour: 2 green, 4 dark blue, 6 grey, 10 white, 13 red, 15 yellow, 18 light blue
  uint32 faction  = 3; // 1 ally ... 5 indifferent ... 9 scowls
  int32  hp       = 4;
  int32  max_hp   = 5;
}

message LootEvent {
  uint32          corpse_id = 1;
  bool            ok        = 2;
  string          error     = 3; // why not, when !ok
  repeated string items     = 4; // what came off the corpse
  uint32          platinum  = 5; // coin on the corpse (looted automatically)
  uint32          gold      = 6;
  uint32          silver    = 7;
  uint32          copper    = 8;
  repeated string left      = 9; // what's still on it (no room for it, or it wouldn't come)
}

message MerchantEvent {
  uint32          npc_id  = 1;
  bool            open    = 2;
  repeated Item   items   = 3; // for sale: slot is the merchant slot, price what it costs us (copper)
  bool            parcel_merchant = 4; // it takes and hands out parcels
  repeated Parcel parcels = 5;         // a parcel merchant: the parcels waiting for us
}

// a parcel waiting at the parcel merchants (ParcelRetrieveCommand takes slot and item_id)
message Parcel {
  uint32 slot     = 1;
  uint32 item_id  = 2; // 99990 is coin (quantity: copper)
  string name     = 3;
  uint32 quantity = 4;
  string from     = 5;
  string note     = 6;
  int64  sent     = 7; // unix time
}

message DeathEvent {
  string killer    = 1;
  uint32 corpse_id = 2;
  uint32 spell_id  = 3; // 0 if not a spell
  uint32 damage    = 4;
}

message GameEvent {
  oneof event {
    ChatMessage   chat     = 1;
    ServerMessage message  = 2;
    MoveEvent     move     = 3;
    ZoneEvent     zone     = 4;
    ConsiderEvent consider = 5;
    LootEvent     loot     = 6;
    DeathEvent    death    = 7; // ours; the server then sends us to our bind point (a zone change)
    MerchantEvent merchant = 8;
    SkillEvent    skill    = 9; // a skill (or language) went up: the client prints "You have become better at ..."
  }
}

message SkillEvent {
  uint32 skill_id = 1; // EQ skill id; 100 and up are languages (100 + language id)
  string name     = 2; // "1H Blunt", "Abjuration", "Common Tongue", ...
  uint32 value    = 3; // the new value
}

// client -> server
message ClientFrame {
  oneof payload {
    Hello   hello   = 1;
    Command command = 2;
  }
}

// ---- state (M2) ----
//
// After Welcome the server sends one Snapshot, then StateDelta messages (a few per second)
// whenever something changed. Positions are in-game coordinates (the same as /loc, which
// prints y before x). Headings use EQ's 0-512 range.

enum SpawnType {
  SPAWN_TYPE_UNKNOWN     = 0;
  SPAWN_TYPE_PLAYER      = 1; // real or headless player character
  SPAWN_TYPE_NPC         = 2; // includes pets and mercenaries
  SPAWN_TYPE_BOT         = 3; // EQEmu bot
  SPAWN_TYPE_PLAYER_CORPSE = 4;
  SPAWN_TYPE_NPC_CORPSE  = 5;
}

message Spawn {
  uint32    id         = 1;
  string    name       = 2;  // clean name, e.g. "a_rat" -> "a rat"
  SpawnType type       = 3;
  uint32    level      = 4;
  uint32    class_id   = 5;
  uint32    race_id    = 6;
  float     x          = 7;
  float     y          = 8;
  float     z          = 9;
  float     heading    = 10;
  uint32    hp_pct     = 11; // 0-100
  uint32    owner_id   = 12; // pet / bot owner spawn id, 0 if none (bots: their owning character)
  bool      headless   = 13; // a headless (AI-controlled) character
  uint32    target_id  = 14; // who it has targeted (for NPCs in combat: who it's hitting), 0 if none
  uint32    mana_pct   = 15; // 0-100 (0 for spawns without mana)
}

message Self {
  uint32 spawn_id         = 1;
  string name             = 2;
  uint32 level            = 3;
  uint32 class_id         = 4;
  uint32 race_id          = 5;
  int64  hp               = 6;
  int64  max_hp           = 7;
  int64  mana             = 8;
  int64  max_mana         = 9;
  int64  endurance        = 10;
  int64  max_endurance    = 11;
  float  x                = 12;
  float  y                = 13;
  float  z                = 14;
  float  heading          = 15;
  uint32 target_id        = 16; // 0 if none
  bool   sitting          = 17;
  bool   auto_attack      = 18;
  uint32 casting_spell_id = 19; // 0 if not casting
  repeated GroupMember group = 20; // empty when not grouped; includes ourselves
  repeated Gem    gems     = 21; // memorised spells
  repeated Buff   buffs    = 22;
  uint32          platinum = 23; // carried coin
  uint32          gold     = 24;
  uint32          silver   = 25;
  uint32          copper   = 26;
  repeated uint32 haters   = 27; // NPCs with us on their hate list: we're engaged while any are
  uint32          weight   = 28; // carried weight (as the client shows it)
  uint32          capacity = 29; // carry more than this (= STR) and you're encumbered
  uint32          race_bit = 30; // our bit in Item.races
  float           exp_pct    = 31; // progress through the current level, 0-100
  float           aa_exp_pct = 32; // progress to the next AA point, 0-100
  uint32          aa_points  = 33; // unspent AA points
  uint32          aa_split   = 34; // share of experience going to AA, 0-100
  float           run_speed  = 35; // how fast a move_to walks now, units per second (buffs, snares, GM speed; 0 rooted)
  repeated uint32 disciplines = 36; // spell ids of the disciplines you know (DisciplineCommand)
  uint32          game_hour  = 37; // the zone's EQ hour, 1-24 as the client shows it (an EQ hour is 3 real minutes;
                                   // some zones spawn differently by night: spawn_events)
  uint32          air        = 38; // seconds of air left under water (full whenever you can breathe)
  uint32          max_air    = 39; // seconds of air at most (Stamina, Lung Capacity); at none, you drown
}

message Gem {
  uint32 slot     = 1; // 0-based
  uint32 spell_id = 2;
  string name     = 3;
  bool   ready    = 4; // not refreshing
}

message Buff {
  uint32 spell_id = 1;
  string name     = 2;
  int32  ticks    = 3; // 6s ticks left; -1 permanent
}

message BookSpell {
  uint32 spell_id = 1;
  string name     = 2;
  uint32 level    = 3; // the level our class gets it
  uint32 slot     = 4; // its page in the book
}

message SpellBook { repeated BookSpell spells = 1; }

message Item {
  int32  slot      = 1; // EQEmu inventory slot id
  uint32 item_id   = 2;
  string name      = 3;
  int32  charges   = 4;
  bool   container = 5;
  // what it is, for deciding what to wear, keep and sell
  int32  ac        = 6;
  int32  hp        = 7;
  int32  mana      = 8;
  int32  endurance = 9;
  int32  str       = 10;
  int32  sta       = 11;
  int32  agi       = 12;
  int32  dex       = 13;
  int32  wis       = 14;
  int32  int       = 15;
  int32  cha       = 16;
  uint32 damage    = 17;
  uint32 delay     = 18;
  uint32 slots     = 19; // bitmask of worn slots it fits (bit n = slot n)
  uint32 req_level = 20;
  float  weight    = 21;
  uint32 price     = 22; // base value in copper (merchant items: what it costs us)
  bool   no_drop   = 23;
  bool   lore      = 24;
  bool   magic     = 25;
  uint32 bag_slots = 26; // containers
  uint32 bag_size  = 27; // biggest item it holds: 0 tiny ... 4 giant
  uint32 item_type = 28; // EQ item type (skill), e.g. 0 1H slashing, 10 armour, 11 misc
  bool   usable    = 29; // its holder (us, or the bot wearing it) can equip it at its level
  uint32 classes   = 30; // bitmask: bit (class - 1)
  uint32 races     = 31; // bitmask of player races (EQ race bits: human 1, barbarian 2, ... dwarf 128 ...)
  uint32 scroll_spell = 32; // a spell scroll: the spell it teaches
  uint32 scroll_level = 33; // ... and the level our class can learn it at (0: not our class)
  uint32 bag_wr    = 34; // containers: weight reduction, percent
  uint32 bag_type  = 35; // containers: EQ bag type (0-8 storage: bag, chest, quiver...; 9 and up tradeskill: mixing bowl, kiln...)
}

// our EQEmu bots and what they wear; we equip them (^inventorygive)
message BotGear {
  uint32        spawn_id  = 1;
  string        name      = 2;
  uint32        class_id  = 3;
  uint32        race_id   = 4;
  uint32        level     = 5;
  uint32        race_bit  = 6; // its bit in Item.races
  repeated Item equipment = 7; // slot is the worn slot
}

message OwnedBots { repeated BotGear bots = 1; }

message Inventory { repeated Item items = 1; } // carried and banked (bank slots 2000-2023 and their bags)

message GroupMember {
  string name     = 1;
  uint32 spawn_id = 2; // 0 if not in this zone
  bool   leader   = 3;
  bool   bot      = 4; // an EQEmu bot
}

message ZoneInfo {
  uint32 id          = 1;
  uint32 instance_id = 2;
  string short_name  = 3;
  string long_name   = 4;
  repeated ZoneExit exits = 5; // zone lines out of this zone
}

message ZoneExit {
  string zone    = 1; // short name
  uint32 zone_id = 2;
  float  x       = 3; // where the zone line is; a coordinate of +-999999 means "anywhere along this axis"
  float  y       = 4;
  float  z       = 5;
}

message Snapshot {
  Self           me     = 1;
  ZoneInfo       zone   = 2;
  repeated Spawn spawns = 3; // everyone else in the zone
  SpellBook      book      = 4;
  Inventory      inventory = 5;
  OwnedBots      bots      = 6;
}

message StateDelta {
  Self            me             = 1; // always the full Self (small)
  repeated Spawn  spawns_changed = 2; // added or changed spawns, full records
  repeated uint32 spawns_removed = 3;
  SpellBook       book           = 4; // only when it changed
  Inventory       inventory      = 5; // only when it changed
  OwnedBots       bots           = 6; // only when it changed
}

// server -> client
message ServerFrame {
  oneof payload {
    Welcome    welcome  = 1;
    Refused    refused  = 2;
    Snapshot   snapshot = 3;
    StateDelta    delta    = 4;
    GameEvent     event    = 5;
    CommandResult result   = 6;
  }
}
